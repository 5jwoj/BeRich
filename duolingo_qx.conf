# ══════════════════════════════════════════════════════════════════
# 📋  使用说明（图文步骤）
# ══════════════════════════════════════════════════════════════════
#
# ① 准备脚本文件
#    - 将 duolingo_capture.js 和 duolingo_farm.js 两个文件
#      复制到 iCloud Drive > Quantumult X > Scripts 文件夹
#
# ② 配置 MITM
#    - 打开 QX > 右下角 ⚙️ > MitM
#    - 开启「MitM」开关
#    - 点击「生成证书」并在系统设置中信任该证书
#    - 点击「主机名」，添加: *.duolingo.com
#
# ③ 添加重写规则（两种方法选一）
#    方法一（图形界面）:
#      QX > 重写 > 右上角 + > 选「脚本」
#        - 类型: 请求脚本 (Request Script)
#        - 匹配: ^https:\/\/www\.duolingo\.com\/2017-06-30\/
#        - 脚本路径: [iCloud]Quantumult X/Scripts/duolingo_capture.js
#
#    方法二（配置文件）:
#      直接将 [rewrite_local] 节的内容粘贴到配置文件
#
# ④ 添加定时任务
#    - QX > 任务 > 右上角 + > 粘贴以下内容:
#      0 8 * * * [iCloud]Quantumult X/Scripts/duolingo_farm.js
#      Tag 填写: 🦜 Duolingo 每日刷课
#
# ⑤ 首次使用（捕获 Token）
#    - 确保 QX 处于运行状态（开启代理）
#    - 打开 Duolingo App，随便浏览几秒
#    - 看到「✅ Token 捕获成功」通知即完成
#
# ⑥ 手动触发刷课
#    - QX > 任务 > 找到「🦜 Duolingo 每日刷课」> 点击运行按钮
#
# ══════════════════════════════════════════════════════════════════
# ⚠️  注意事项
# ══════════════════════════════════════════════════════════════════
#
# 1. Duolingo JWT Token 有效期通常为 30 天，过期后需重新打开 App 刷新
# 2. 脚本会自动检测 Token 过期并发送通知提醒
# 3. 使用此脚本违反 Duolingo 用户服务协议，风险自担
# 4. 建议设置合理的 TARGET_XP（推荐 10-30），避免异常行为触发封号
# 5. 首次抓到 Token 后，无需每次使用都打开 App（Token 期间内持久有效）
