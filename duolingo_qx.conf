# ║         Duolingo Lazy - Quantumult X 配置片段 (v1.2.0)         ║
# ║  更新日志:                                                      ║
# ║  - v1.2.0: 支持网页端登录 Cookie (jwt_token) 及 Response 头抓取   ║
# ║            优化日志与逻辑，防止网页加载多接口时的弹窗轰炸          ║
# ║  - v1.1.0: 增加详细控制台日志，支持 Header及Cookie 多源Token提取   ║
# ╚══════════════════════════════════════════════════════════════════╝
#

# ──────────────────────────────────────────────────────────────────
# 1. MITM 域名配置（添加到 [mitm] 节）
# ──────────────────────────────────────────────────────────────────
[mitm]
hostname = *.duolingo.com, duolingo.com, *.duolingo.cn, duolingo.cn, *-api.duolingo.com


# ──────────────────────────────────────────────────────────────────
# 2. 请求重写 / Token 捕获（添加到 [rewrite_local] 节）
# ──────────────────────────────────────────────────────────────────
[rewrite_local]

# 拦截 Duolingo API 及网页发起的请求/响应，提取 Authorization Header 或 Cookie 中的 JWT
^https?:\/\/(www\.|[a-z0-9-]+\.)?duolingo\.(com|cn)\/ url script-request-header https://raw.githubusercontent.com/5jwoj/BeRich/main/duolingo_capture.js
^https?:\/\/(www\.|[a-z0-9-]+\.)?duolingo\.(com|cn)\/2017-06-30\/login url script-response-header https://raw.githubusercontent.com/5jwoj/BeRich/main/duolingo_capture.js


# ──────────────────────────────────────────────────────────────────
# 3. 定时任务（添加到 [task_local] 节）
# ──────────────────────────────────────────────────────────────────
[task_local]

# 每天早上 08:00 自动刷课（打卡连胜 🔥）
# cron 格式: 分 时 日 月 星期
0 8 * * * https://raw.githubusercontent.com/5jwoj/BeRich/main/duolingo_farm.js, tag=🦜 Duolingo 每日刷课, img-url=https://www.google.com/s2/favicons?domain=duolingo.com&sz=256, enabled=true


# ══════════════════════════════════════════════════════════════════
# 📋  v1.2.0 排错与日志查看说明
# ══════════════════════════════════════════════════════════════════
#
# 如果在网页或 App 中登录 Duolingo 后没有收到弹窗提示，请依次排查：
#
# 1. 确认 QX 的 MitM 证书已安装并信任（支持 App 及网页 iOS Safari / PC 浏览器）
#    - QX > ⚙️ > MitM > 必须开启，并且在 iOS 设置 > 通用 > 关于本机 > 证书信任设置 中信任证书
#
# 2. 查看 QX 实时日志（Log）
#    - 打开 QX > 右下角 ⚙️ > 划到最底部 > 找到「日志」(Log) > 开启「工具日志」
#    - 打开 Duolingo 网页 (https://www.duolingo.com) 或 App 进行登录
#    - 检查日志中是否有 [Duolingo Capture v1.2.0] 的输出：
#      - 若已登录成功且 Token 未变，脚本将静默维持有效（不会弹窗骚扰），控制台会显示日志
#      - 若显示 "Cookie/Token 捕获成功"，说明新凭证已保存并可直接开启定时刷课任务
