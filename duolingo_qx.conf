# ╔══════════════════════════════════════════════════════════════════╗
# ║         Duolingo Lazy - Quantumult X 配置片段                  ║
# ║  将以下各节内容合并到你的 QX 配置文件对应位置                    ║
# ╚══════════════════════════════════════════════════════════════════╝
#
# 📁 脚本文件需要先上传到可访问的位置，有三种方式：
#
#   方式 A（推荐）: 放入 iCloud Drive > Quantumult X > Scripts 文件夹
#                   路径格式: [iCloud]Quantumult X/Scripts/duolingo_capture.js
#
#   方式 B: 放在本地 /var/mobile/Library/Application Support/Quantumult X/Scripts/
#           路径格式: [本地路径]duolingo_capture.js
#
#   方式 C: 上传到 GitHub Raw / 自建服务器
#           路径格式: https://raw.githubusercontent.com/你的名字/repo/main/duolingo_capture.js
#
# ⚠️  重要: 需要对 duolingo.com 开启 MITM (中间人解密)，否则无法抓取 HTTPS 流量
#

# ──────────────────────────────────────────────────────────────────
# 1. MITM 域名配置（添加到 [mitm] 节）
# ──────────────────────────────────────────────────────────────────
[mitm]
hostname = *.duolingo.com, duolingo.com


# ──────────────────────────────────────────────────────────────────
# 2. 请求重写 / Token 捕获（添加到 [rewrite_local] 节）
# ──────────────────────────────────────────────────────────────────
[rewrite_local]

# 拦截 Duolingo 所有需要鉴权的 API 请求，自动提取 JWT
# 触发范围: 打开 App 后几乎所有接口都会携带 Bearer Token
^https:\/\/www\.duolingo\.com\/2017-06-30\/ url script-request-header [iCloud]Quantumult X/Scripts/duolingo_capture.js

# 备用规则: 也拦截旧版 API 路径
^https:\/\/www\.duolingo\.com\/api\/1\/ url script-request-header [iCloud]Quantumult X/Scripts/duolingo_capture.js


# ──────────────────────────────────────────────────────────────────
# 3. 定时任务（添加到 [task_local] 节）
# ──────────────────────────────────────────────────────────────────
[task_local]

# 每天早上 08:00 自动刷课（维持连胜 🔥）
# cron 格式: 分 时 日 月 星期
0 8 * * * [iCloud]Quantumult X/Scripts/duolingo_farm.js, tag=🦜 Duolingo 每日刷课, img-url=https://www.google.com/s2/favicons?domain=duolingo.com&sz=256, enabled=true

# 可选: 每天 20:00 再刷一次（刷更多 XP）
# 0 20 * * * [iCloud]Quantumult X/Scripts/duolingo_farm.js, tag=🦜 Duolingo 晚间刷课, img-url=https://www.google.com/s2/favicons?domain=duolingo.com&sz=256, enabled=false


