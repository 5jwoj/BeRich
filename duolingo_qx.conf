# ╔══════════════════════════════════════════════════════════════════╗
# ║         Duolingo Lazy - Quantumult X 配置片段 (v1.1.0)         ║
# ║  更新日志:                                                      ║
# ║  - v1.1.0: 增加详细控制台日志，支持 Header及Cookie 多源Token提取   ║
# ║            扩宽匹配规则域名，避免某些客户端域名遗漏                ║
# ╚══════════════════════════════════════════════════════════════════╝
#

# ──────────────────────────────────────────────────────────────────
# 1. MITM 域名配置（添加到 [mitm] 节）
# ──────────────────────────────────────────────────────────────────
[mitm]
hostname = *.duolingo.com, duolingo.com, *-api.duolingo.com


# ──────────────────────────────────────────────────────────────────
# 2. 请求重写 / Token 捕获（添加到 [rewrite_local] 节）
# ──────────────────────────────────────────────────────────────────
[rewrite_local]

# 拦截所有 Duolingo 域名发起的 API 请求，提取 Authorization Header 或 Cookie 中的 JWT
^https?:\/\/.*duolingo\.com\/ url script-request-header https://raw.githubusercontent.com/5jwoj/BeRich/main/duolingo_capture.js


# ──────────────────────────────────────────────────────────────────
# 3. 定时任务（添加到 [task_local] 节）
# ──────────────────────────────────────────────────────────────────
[task_local]

# 每天早上 08:00 自动刷课（打卡连胜 🔥）
# cron 格式: 分 时 日 月 星期
0 8 * * * https://raw.githubusercontent.com/5jwoj/BeRich/main/duolingo_farm.js, tag=🦜 Duolingo 每日刷课, img-url=https://www.google.com/s2/favicons?domain=duolingo.com&sz=256, enabled=true


# ══════════════════════════════════════════════════════════════════
# 📋  v1.1.0 排错与日志查看说明
# ══════════════════════════════════════════════════════════════════
#
# 如果打开 Duolingo App 后依然没有收到弹窗提示，请依次排查：
#
# 1. 确认 QX 的 MitM 证书已安装并信任
#    - QX > ⚙️ > MitM > 必须开启，并且在 iOS 设置 > 通用 > 关于本机 > 证书信任设置 中信任证书
#
# 2. 查看 QX 实时日志（Log）
#    - 打开 QX > 右下角 ⚙️ > 划到最底部 > 找到「日志」(Log) > 开启「工具日志」
#    - 重新打开 Duolingo App
#    - 检查日志中是否有 [Duolingo Capture v1.1.0] 的输出：
#      - 若没有任何日志: 说明请求未经过 QX，请检查 VPN/分流模式（需开启全局或分流规则走代理）
#      - 若显示 "当前请求未找到 Bearer Token": 说明此特定请求无鉴权信息，尝试在 App 内部切换标签页刷新数据即可
