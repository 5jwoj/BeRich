# Quantumult X 配置片段 - 微信自动阅读
# 功能：自动抓取凭证(udtauth40) + 定时自动阅读和提现
# 作者：Antigravity
#
# 使用指南：
# 1. 将此配置文件片段导入 Quantumult X，或者手动将对应部分复制到您的本地配置文件中。
# 2. 确保已将 `wx_read.js` 脚本文件放置在 Quantumult X 的 `Profiles` 目录下（若使用本地脚本运行方式）。
# 3. 启用 MitM 证书并开启重写与定时任务。

[mitm]
# 域名主机名解密
hostname = m.7jvcsjirb.cn

[rewrite_local]
# 微信阅读凭证拦截捕获（微信内打开阅读页或刷新相关请求时自动触发）
^https?:\/\/m\.7jvcsjirb\.cn\/ url script-request-header https://raw.githubusercontent.com/5jwoj/BeRich/main/wx_read.js

[task_local]
# 定时自动阅读任务：每天 8:00 到 22:00 之间，每 30 分钟运行一次
*/30 8-22 * * * https://raw.githubusercontent.com/5jwoj/BeRich/main/wx_read.js, tag=微信自动阅读, img-url=https://raw.githubusercontent.com/5jwoj/BeRich/main/assets/wx_read.png, enabled=true
