# 阿里云社区 Cookie Sync for Quantumult X
# 作者: z.W.
# 版本: v1.0.2
# 
# 抓取阿里云社区Cookie并同步至青龙面板。
# 获取 Cookie 方式: 阿里云 APP - 首页 - 积分商城 或 网页版登录后进入个人中心
# 
# [说明]
# Quantumult X 用户请通过 BoxJs 订阅配置以下四个参数，或者通过重写脚本的请求头传入（较麻烦）。
# 建议使用 BoxJs 设置以下键值:
# - ql_url: 青龙面板地址 (例如 http://192.168.1.1:5700)
# - ql_client_id: 青龙面板 Client ID
# - ql_client_secret: 青龙面板 Client Secret
# - ql_data_name: 青龙变量名 (默认 aliyunWeb_data)

[rewrite_local]
# Cookie抓取脚本 - 命中时从请求头Cookie和响应体获取用户信息
^https?:\/\/developer\.aliyun\.com\/developer\/api\/my\/user\/getUser url script-res-body https://raw.githubusercontent.com/5jwoj/BeRich/refs/heads/main/aliyun/aliyun_web_cookie_qx.js

[mitm]
hostname = developer.aliyun.com
